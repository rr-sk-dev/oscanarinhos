server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entry points and service-worker files: always revalidate.
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed bundles (outputHashing: all), e.g. main-64L5HHFR.js, styles-RNSXDBFA.css.
    # Missing ones 404 instead of falling back to index.html.
    location ~ "^/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app (index.html, no-cache via the rule above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
