<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <title>Os Canarinhos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0b" />
    <meta
      name="description"
      content="Os Canarinhos, equipa de futebol amador de Lisboa: jogos, resultados, plantel, classificação, notícias e transmissões em direto."
    />
    <!-- Link previews (WhatsApp, Instagram, …). The app renders in the browser, so every shared
         link gets this site-level preview rather than one per page. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:site_name" content="Os Canarinhos" />
    <meta property="og:title" content="Os Canarinhos" />
    <meta
      property="og:description"
      content="Jogos, resultados, plantel, notícias e transmissões em direto d'Os Canarinhos."
    />
    <meta property="og:url" content="https://oscanarinhos.rrodrigues.dev/" />
    <meta property="og:image" content="https://oscanarinhos.rrodrigues.dev/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Emblema d'Os Canarinhos" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply a saved light theme before Angular boots to avoid a flash. Dark is the default
      // and needs no attribute (see ThemeService).
      try {
        if (localStorage.getItem('canarinhos-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
