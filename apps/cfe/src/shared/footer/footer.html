<footer class="bg-cui-surface text-cui-ink border-t border-cui-line">
  <div class="max-w-5xl mx-auto px-6 lg:px-8 py-8">
    <!-- Sponsors Section -->
    @if (sponsors().length > 0) {
      <div class="mb-8">
        <h2 class="text-center text-xs font-semibold text-cui-ink-3 uppercase tracking-wider mb-6">
          Patrocinadores
        </h2>
        <div class="flex flex-wrap items-center justify-center gap-6">
          @for (sponsor of sponsors(); track sponsor.name) {
            @if (sponsor.url) {
              <a
                [href]="sponsor.url"
                target="_blank"
                rel="noopener noreferrer"
                class="flex items-center justify-center w-28 h-16 bg-cui-surface-2 rounded-lg p-3 hover:bg-cui-tile-bg transition-colors"
              >
                <img
                  [src]="sponsor.logoUrl"
                  [alt]="sponsor.name"
                  class="max-w-full max-h-full object-contain"
                />
              </a>
            } @else {
              <div
                class="flex items-center justify-center w-28 h-16 bg-cui-surface-2 rounded-lg p-3"
              >
                <img
                  [src]="sponsor.logoUrl"
                  [alt]="sponsor.name"
                  class="max-w-full max-h-full object-contain"
                />
              </div>
            }
          }
        </div>
      </div>
      <div class="border-t border-cui-line mb-8"></div>
    }

    <!-- Social -->
    @if (socialLinks().length > 0) {
      <div class="flex justify-center items-center gap-3 mb-6">
        @for (social of socialLinks(); track social.platform) {
          <a
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            class="p-1.5 text-cui-ink-3 hover:text-cui-ink transition-colors"
            [attr.aria-label]="social.platform"
          >
            <cui-svg-icon [name]="social.platform" [size]="20" />
          </a>
        }
      </div>
    }

    <!-- Copyright -->
    <p class="text-center text-[11px] text-cui-ink-3">
      &copy; {{ currentYear }} {{ companyName() }}
    </p>
  </div>
</footer>
