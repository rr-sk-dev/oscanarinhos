<div class="rounded-2xl border border-cui-line bg-cui-loss-bg p-5 text-center" role="alert">
  <p class="text-sm font-semibold text-cui-loss">{{ message() }}</p>
  @if (canRetry()) {
    <button
      type="button"
      (click)="retry.emit()"
      class="mt-3 rounded-lg border border-cui-line bg-cui-surface px-4 py-2 text-xs font-bold text-cui-ink transition-colors hover:bg-cui-surface-2"
    >
      Tentar novamente
    </button>
  }
</div>
