<div class="relative">
  <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">
    <cui-svg-icon name="search" [size]="20" color="var(--cui-ink-3)"></cui-svg-icon>
  </div>

  <input
    type="text"
    name="search-input"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    class="w-full pl-10 py-2 text-sm bg-cui-surface text-cui-ink border border-cui-line rounded-lg focus:outline-none focus:ring-2 focus:ring-cui-yellow-500 focus:border-transparent disabled:bg-cui-surface-2 disabled:cursor-not-allowed placeholder:text-cui-ink-3"
    [class.pr-10]="showClearButton()"
  />

  @if (showClearButton()) {
    <button
      type="button"
      (click)="clear()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-cui-ink-3 hover:text-cui-ink-2 focus:outline-none focus:text-cui-ink-2 transition-colors"
      aria-label="Clear search"
    >
      <cui-svg-icon
        name="close"
        [size]="16"
        color="currentColor"
        class="hover:cursor-pointer"
      ></cui-svg-icon>
    </button>
  }
</div>
