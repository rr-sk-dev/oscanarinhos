@if (hasError()) {
  <div class="error-state">
    <div class="error-content">
      <svg
        class="error-icon"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      <p class="error-title">Não foi possível carregar o vídeo</p>
      <p class="error-message">Verifique o ID ou o URL do vídeo</p>
    </div>
  </div>
} @else if (embedUrl(); as url) {
  <div class="video-wrapper">
    @if (isLoading()) {
      <div class="loading-overlay">
        <div class="spinner"></div>
      </div>
    }

    <iframe
      [src]="url"
      [title]="title()"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
      class="video-iframe"
      (load)="onLoad()"
      (error)="onError()"
    ></iframe>
  </div>
}
