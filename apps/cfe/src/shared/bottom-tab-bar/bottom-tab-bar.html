<nav
  class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-cui-tab-bg border-t border-cui-line safe-bottom transition-colors duration-200"
  aria-label="Navegação principal"
>
  <div class="flex items-stretch h-16">
    @for (tab of tabs; track tab.route) {
      <!-- routerLinkActive sets aria-current="page"; the aria-[current=page] variants style the active tab -->
      <a
        [routerLink]="tab.route"
        routerLinkActive
        ariaCurrentWhenActive="page"
        class="group relative flex flex-1 flex-col items-center justify-center gap-0.5 pt-1.5 transition-colors text-cui-ink-3 aria-[current=page]:text-cui-ink"
      >
        <!-- Active indicator bar -->
        <span
          class="absolute top-0 left-1/2 -translate-x-1/2 h-0.5 w-0 rounded-full bg-cui-yellow-500 transition-all duration-200 group-aria-[current=page]:w-5"
        ></span>

        <cui-svg-icon [name]="tab.icon" [size]="22" />
        <span class="text-[10px] font-medium leading-tight">{{ tab.label }}</span>
      </a>
    }
  </div>
</nav>
