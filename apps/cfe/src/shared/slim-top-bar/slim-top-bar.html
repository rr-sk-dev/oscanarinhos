<nav
  class="hidden md:block fixed top-0 left-0 right-0 z-50 bg-cui-tab-bg/90 backdrop-blur-lg border-b border-cui-line transition-colors duration-200"
  aria-label="Navegação principal"
>
  <div class="h-14 flex items-center justify-between px-6 lg:px-8 max-w-5xl mx-auto">
    <!-- Logo + Team Name -->
    <a routerLink="/home" class="flex items-center gap-2.5 hover:opacity-80 transition-opacity">
      @if (teamLogo(); as logo) {
        <img [src]="logo" [alt]="teamName" class="w-9 h-9 object-contain" />
      }
      <span class="font-display text-[22px] leading-none tracking-[0.03em] text-cui-ink">
        {{ teamName }}
      </span>
    </a>

    <!-- Nav Items -->
    <div class="flex items-center gap-1">
      @for (item of items; track item.route) {
        <!-- routerLinkActive sets aria-current="page"; the aria-[current=page] variants style the active item -->
        <a
          [routerLink]="item.route"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="group relative px-3 py-1.5 text-sm font-medium rounded-lg transition-colors text-cui-ink-3 hover:text-cui-ink hover:bg-cui-surface-2 aria-[current=page]:text-cui-ink aria-[current=page]:hover:bg-transparent"
        >
          {{ item.label }}
          <!-- Active bar -->
          <span
            class="absolute -bottom-px left-1/2 -translate-x-1/2 h-0.5 w-0 rounded-full bg-cui-yellow-500 transition-all duration-200 group-aria-[current=page]:w-5"
          ></span>
        </a>
      }

      <!-- Live CTA -->
      <a
        routerLink="/live"
        class="ml-3 flex items-center gap-1.5 px-3 py-1.5 bg-cui-yellow-500 text-cui-black text-xs font-bold rounded-lg hover:bg-cui-yellow-400 transition-colors"
      >
        <cui-svg-icon name="live" [size]="16" />
        Ao Vivo
      </a>
    </div>
  </div>
</nav>
