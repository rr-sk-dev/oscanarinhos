<form (submit)="submit($event)">
  <fieldset class="rounded-lg border border-cui-line p-3">
    <legend class="px-1 text-sm font-extrabold text-cui-ink">Presenças</legend>
    <ul class="flex flex-col gap-1">
      @for (member of members(); track member.membershipId) {
        <li>
          <label class="flex items-center gap-3 py-1.5 text-sm text-cui-ink">
            <input
              type="checkbox"
              class="h-5 w-5 accent-cui-yellow-500"
              [name]="'attended-' + member.membershipId"
              [checked]="isAttended(member.membershipId)"
              (change)="toggle(member.membershipId)"
            />
            {{ member.displayName }}
          </label>
        </li>
      } @empty {
        <li class="text-sm text-cui-ink-2">Ainda não há membros na equipa.</li>
      }
    </ul>
  </fieldset>
  <button
    type="submit"
    [disabled]="isSaving()"
    class="mt-3 w-full rounded-lg bg-cui-yellow-500 px-4 py-2 text-sm font-bold text-cui-black disabled:opacity-50"
  >
    Guardar presenças
  </button>
</form>
