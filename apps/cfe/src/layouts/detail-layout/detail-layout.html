<!-- Mini header with back button -->
<header
  class="fixed top-0 left-0 right-0 z-50 bg-cui-tab-bg/90 backdrop-blur-lg border-b border-cui-line pt-[env(safe-area-inset-top)] transition-colors duration-200"
>
  <div class="h-12 flex items-center px-4 max-w-5xl mx-auto">
    <button
      type="button"
      (click)="goBack()"
      class="flex items-center gap-1 text-sm font-semibold text-cui-ink-2 hover:text-cui-ink transition-colors -ml-1 p-1 rounded-lg"
      aria-label="Voltar"
    >
      <cui-svg-icon name="back_arrow" [size]="20" />
      <span>Voltar</span>
    </button>
  </div>
</header>

<!-- Content with top padding for fixed header -->
<main class="min-h-dvh pt-[calc(3rem+env(safe-area-inset-top))]">
  <router-outlet />
</main>
