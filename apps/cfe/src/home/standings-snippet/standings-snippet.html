<section>
  <div class="flex items-baseline justify-between mb-3">
    <h2 class="text-[17px] font-extrabold tracking-[-0.01em] text-cui-ink">Classificação</h2>
    <a
      routerLink="/results"
      [queryParams]="{ tab: 'tabela' }"
      class="text-[13px] font-bold text-cui-accent-text hover:opacity-80 transition-opacity"
    >
      Tabela completa
    </a>
  </div>

  @if (loading()) {
    <div class="h-[150px] rounded-[20px] skeleton-shimmer" aria-busy="true"></div>
  } @else if (rows().length === 0) {
    <div class="rounded-[20px] border border-cui-line bg-cui-surface py-6 text-center">
      <p class="text-sm text-cui-ink-3">Sem dados de classificação</p>
    </div>
  } @else {
    <app-standings-table [rows]="rows()" />
  }
</section>
