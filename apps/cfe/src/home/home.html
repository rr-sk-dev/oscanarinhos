<!-- Header + next match, on the yellow glow -->
<section class="home-glow">
  <div class="max-w-5xl mx-auto px-4 pt-[calc(env(safe-area-inset-top)+1rem)] md:pt-10">
    <div class="flex flex-col items-center text-center">
      <img
        ngSrc="assets/canarinhos.png"
        alt=""
        width="76"
        height="76"
        priority
        class="w-[76px] h-[76px] object-contain drop-shadow-[0_8px_18px_rgba(0,0,0,0.25)]"
      />
      <h1 class="mt-2.5 font-display text-[34px] leading-none tracking-[0.03em] text-cui-ink">
        {{ teamName }}
      </h1>
      <p class="mt-0.5 text-xs text-cui-ink-2">{{ teamSubtitle }}</p>
    </div>

    <app-next-match-card
      class="mt-[22px] md:max-w-xl md:mx-auto"
      [match]="nextMatch()"
      [loading]="nextMatchLoading()"
      [error]="nextMatchError()"
      [isLive]="isLive()"
      [countdown]="countdown()"
      (retry)="retryNextMatch()"
    />
  </div>
</section>

<div class="max-w-5xl mx-auto px-4 pt-7 pb-8 flex flex-col gap-8">
  <app-recent-results
    [matches]="recentResults()"
    [loading]="resultsLoading()"
    [ourTeamId]="ourTeamId()"
  />
  <app-latest-news [articles]="latestNews()" [loading]="newsLoading()" />
  <app-standings-snippet [rows]="standingRows()" [loading]="standingsLoading()" />
  <app-testimonials-carousel [testimonials]="testimonials()" [loading]="testimonialsLoading()" />
  <app-store-preview />
</div>
