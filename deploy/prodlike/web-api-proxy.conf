# DEV-ONLY (compose.prodlike.yaml): emulates the host Caddy route
#   /api/*  -> capi:3000
# Not baked into the web image; production routing is done by Caddy.
location ^~ /api/ {
    # Docker's embedded DNS; resolving per request means nginx starts even if capi is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $capi_upstream http://capi:3000;
    proxy_pass $capi_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
