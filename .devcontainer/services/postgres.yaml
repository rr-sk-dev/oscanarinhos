# Postgres for dev. Apps use DATABASE_URL (host postgres.sandbox:5432). Credentials: ../.env (generated).
services:
  postgres:
    image: postgres:18-trixie
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql   # Postgres 18+ image layout
    networks:
      sandbox:
        aliases: [postgres.sandbox]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128m
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2
    pids_limit: 256

volumes:
  postgres-data: {}
